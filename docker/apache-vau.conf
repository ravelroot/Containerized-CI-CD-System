<VirtualHost *:80>
    DocumentRoot /app/public
    <Directory /app/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    <Directory /app/public/assets>
        Header set Cache-Control "public, max-age=604800"
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
